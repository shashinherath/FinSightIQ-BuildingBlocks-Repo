name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FinSightIQ.BuildingBlocks.sln

      - name: Build
        run: dotnet build FinSightIQ.BuildingBlocks.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FinSightIQ.BuildingBlocks.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Pack (validation only, not published)
        run: dotnet pack src/FinSightIQ.BuildingBlocks/FinSightIQ.BuildingBlocks.csproj --configuration Release --no-build --output ./artifacts
